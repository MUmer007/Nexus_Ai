[project]
name = "nexus-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pyiceberg[s3fs]>=0.12.0",
    "pyspark==3.5.3",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
nexus-ai = "nexus_ai:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
