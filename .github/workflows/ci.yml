name: NEXUS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: |
          uv venv
          uv sync

      - name: Run Ruff Format Check
        run: uv run ruff format --check pipelines/

      - name: Run Ruff Lint
        run: uv run ruff check pipelines/

  dbt-syntax-check:
    name: dbt Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv & dbt-duckdb
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv venv
          uv pip install dbt-duckdb

      - name: Validate dbt Project Syntax
        working-directory: pipelines/dbt/nexus_gold
        run: |
          cat > profiles.yml << 'EOF'
          nexus_gold:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: ':memory:'
          EOF

          echo "Generated profiles.yml:"
          cat profiles.yml

          # Install packages declared in packages.yml (dbt_utils, etc.)
          uv run dbt deps --profiles-dir .

          # Validate project compilation
          uv run dbt parse --profiles-dir .