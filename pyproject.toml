[project]
name = "nexus-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "mlflow>=3.16.1",
    "openai>=3.14.1",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pyiceberg[s3fs]>=0.12.0",
    "pyspark==3.5.3",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.64.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
nexus-ai = "nexus_ai:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff==0.16.6",
]
