name: NEXUS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: uv sync

      - name: Run Ruff (Format & Lint)
        run: |
          uv run ruff format pipelines/
          uv run ruff check pipelines/

  dbt-syntax-check:
    name: dbt Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv & dbt-duckdb
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv pip install dbt-duckdb

      - name: Validate dbt Project Syntax
        run: |
          cd pipelines/dbt/nexus_gold
          
          # Create a strictly valid dummy profiles.yml for DuckDB in CI
          echo "nexus_gold:" > profiles.yml
          echo "  target: dev" >> profiles.yml
          echo "  outputs:" >> profiles.yml
          echo "    dev:" >> profiles.yml
          echo "      type: duckdb" >> profiles.yml
          echo "      path: ':memory:'" >> profiles.yml
          
          # Parse the project using the dummy profile
          uv run dbt parse --profiles-dir .
