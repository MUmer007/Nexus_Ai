name: NEXUS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: |
          uv venv
          uv sync

      - name: Run Ruff (Format & Lint)
        run: |
          uv run ruff format pipelines/
          uv run ruff check pipelines/

  dbt-syntax-check:
    name: dbt Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv & dbt-duckdb
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv venv
          uv pip install dbt-duckdb

      - name: Validate dbt Project Syntax
        run: |
          cd pipelines/dbt/nexus_gold
          
          # Robustly parse the profile name, handling UTF-8 BOM
          PROFILE_NAME="$(python3 - <<'PY'
from pathlib import Path
import re

text = Path("dbt_project.yml").read_text(encoding="utf-8-sig")
match = re.search(r"(?m)^\s*profile\s*:\s*['\"]?([^'\"#\s]+)", text)

if not match:
    raise SystemExit("Could not find a valid 'profile' in dbt_project.yml")

print(match.group(1))
PY
)"
          echo "Found dbt profile name: $PROFILE_NAME"
          
          # Generate strictly valid YAML
          cat > profiles.yml <<EOF
$PROFILE_NAME:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ":memory:"
EOF
          
          uv run dbt parse --profiles-dir .
